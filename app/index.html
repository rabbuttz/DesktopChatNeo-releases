<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // T-1427: the newer iOS on the home screen takes resizes-content to shrink the page itself, by the keyboard and,
      // with no keyboard, by the status bar's room too (the page 812 tall on an 874 screen, the band below it blank).
      // An iPhone / iPad goes back to the page as tall as the screen, only the visible part shrinking with the keyboard
      // (pwa.ts follows that). Before anything is laid out; Android keeps resizes-content.
      ;(function () {
        var ua = navigator.userAgent
        if (!/iP(hone|od|ad)/.test(ua) && !(ua.indexOf('Macintosh') >= 0 && navigator.maxTouchPoints > 1)) return
        var m = document.querySelector('meta[name="viewport"]')
        if (m) m.setAttribute('content', m.getAttribute('content').replace(/,\s*interactive-widget=[\w-]+/, ''))
      })()
    </script>
    <title>DesktopChat Neo</title>
    <meta name="theme-color" content="#fdfcff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24212f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-256.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DC Neo" />
    <!-- T-1432: default, not black-translucent. Under the status bar, iOS 26 on the home screen ends the page the status
         bar's height above the screen's bottom (812 of 874) and leaves a band there the page can't draw in (T-1397).
         With the page starting below the status bar, it can end at the screen's bottom. The bar takes theme-color
         (prefs.ts) where iOS lets it; pwa.ts's bottomGap counts no band then. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
